version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OPENAI_BASE_URL=https://vishrut-macbookpro92.tail318dd5.ts.net/v1
      - OPENAI_MODEL=laya-v3
      - OPENAI_ALLOWED_HOSTS=vishrut-macbookpro92.tail318dd5.ts.net
    volumes:
      - ./data:/app/data
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend